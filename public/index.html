<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f9fa;color:#202124}
.header{background:#1a73e8;color:white;padding:16px 24px;font-size:18px;font-weight:500}
.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:280px;background:white;border-right:1px solid #e0e0e0;padding:16px}
.sidebar h3{font-size:14px;color:#5f6368;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.project{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.project:hover{background:#e8f0fe}
.project.active{background:#e8f0fe;color:#1a73e8;font-weight:500}
.project .del{visibility:hidden;color:#ea4335;cursor:pointer;padding:2px 6px;border-radius:4px}
.project:hover .del{visibility:visible}
.project .del:hover{background:#fce8e6}
.sidebar input{width:100%;padding:8px 10px;border:1px solid #dadce0;border-radius:6px;font-size:13px;margin-top:12px;outline:none}
.sidebar input:focus{border-color:#1a73e8}
.sidebar button{width:100%;padding:8px;margin-top:8px;background:#1a73e8;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.sidebar button:hover{background:#1557b0}
.main{flex:1;padding:24px 32px;overflow-y:auto}
.main h2{font-size:22px;margin-bottom:20px;color:#202124}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:white;border:1px solid #e0e0e0;border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
.card:hover{border-color:#1a73e8;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.card .icon{font-size:28px}
.card .name{font-size:14px;font-weight:500;flex:1}
.card .del{color:#ea4335;cursor:pointer;padding:6px 10px;border-radius:6px;border:none;background:none;font-size:14px}
.card .del:hover{background:#fce8e6}
.card.add{border:2px dashed #dadce0;justify-content:center;color:#5f6368}
.card.add:hover{border-color:#1a73e8;color:#1a73e8}
table{width:100%;background:white;border-radius:12px;overflow:hidden;border:1px solid #e0e0e0;border-collapse:collapse}
th{background:#f8f9fa;padding:12px 16px;text-align:left;font-size:12px;color:#5f6368;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e0e0e0}
td{padding:10px 16px;font-size:13px;border-bottom:1px solid #f1f3f4}
tr:last-child td{border-bottom:none}
.btn{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;margin-right:4px}
.btn-primary{background:#1a73e8;color:white}
.btn-primary:hover{background:#1557b0}
.btn-danger{background:none;color:#ea4335;border:1px solid #ea4335}
.btn-danger:hover{background:#ea4335;color:white}
.btn-green{background:#34a853;color:white;padding:8px 16px;margin-bottom:16px}
.btn-green:hover{background:#2d8f47}
.empty{text-align:center;padding:60px;color:#9aa0a6}
pre{background:#f8f9fa;padding:8px 12px;border-radius:6px;font-size:12px;max-width:300px;overflow-x:auto;margin:0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:white;border-radius:16px;padding:24px;width:460px;max-height:80vh;overflow-y:auto}
.modal-box h3{margin-bottom:16px;font-size:18px}
.modal-box input{width:100%;padding:10px;border:1px solid #dadce0;border-radius:8px;margin-bottom:8px;font-size:14px;outline:none}
.modal-box input:focus{border-color:#1a73e8}
.field-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.field-row input{flex:1;margin-bottom:0}
.field-row button{background:#ea4335;color:white;border:none;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;flex-shrink:0}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-actions button{padding:8px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:none}
</style>
</head>
<body>
<div class="header">🔥 Firebase Clone</div>
<div class="layout">
  <div class="sidebar">
    <h3>Проекты</h3>
    <div id="projectList"></div>
    <input type="text" id="projectInput" placeholder="Название проекта">
    <button onclick="createProject()">Создать проект</button>
  </div>
  <div class="main" id="mainContent">
    <div class="empty">👈 Выбери проект</div>
  </div>
</div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
const API = '/api';
let proj = null, coll = null;

async function loadProjects() {
  const projects = await fetch(API + '/projects').then(r => r.json());
  document.getElementById('projectList').innerHTML = projects.map(p => 
    `<div class="project${proj&&proj.id===p.id?' active':''}" onclick="openProject(${p.id},'${p.name}')">
      📁 ${p.name}
      <span class="del" onclick="event.stopPropagation();delProject(${p.id})">🗑</span>
    </div>`
  ).join('');
}

async function createProject() {
  const name = document.getElementById('projectInput').value.trim();
  if(!name) return alert('Введи название');
  await fetch(API + '/projects', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})
  });
  document.getElementById('projectInput').value = '';
  loadProjects();
}

async function delProject(id) {
  if(!confirm('Удалить?')) return;
  await fetch(API + '/projects/' + id, {method:'DELETE'});
  if(proj&&proj.id===id) { proj=null; document.getElementById('mainContent').innerHTML='<div class="empty">👈 Выбери проект</div>'; }
  loadProjects();
}

async function openProject(id, name) {
  proj={id,name}; coll=null; loadProjects();
  const cols = await fetch(API + '/collections/' + id).then(r => r.json());
  document.getElementById('mainContent').innerHTML = `
    <h2>📁 ${name}</h2>
    <div class="cards">
      ${cols.map(c => `
        <div class="card" onclick="openCollection(${c.id},'${c.name}')">
          <span class="icon">📄</span><span class="name">${c.name}</span>
          <button class="del" onclick="event.stopPropagation();delCollection(${c.id})">🗑</button>
        </div>
      `).join('')}
      <div class="card add" onclick="showAddCol()">+ Новая коллекция</div>
    </div>`;
}

function showAddCol() {
  document.getElementById('modalBox').innerHTML = `
    <h3>Новая коллекция</h3>
    <input id="colName" placeholder="Название (users, posts...)">
    <div class="modal-actions">
      <button onclick="closeModal()" style="background:#f1f3f4">Отмена</button>
      <button onclick="createCollection()" style="background:#1a73e8;color:white">Создать</button>
    </div>`;
  document.getElementById('modal').classList.add('show');
}

async function createCollection() {
  const name = document.getElementById('colName').value.trim();
  if(!name) return;
  await fetch(API + '/collections', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({projectId:proj.id, name})
  });
  closeModal(); openProject(proj.id, proj.name);
}

async function delCollection(id) {
  if(!confirm('Удалить?')) return;
  await fetch(API + '/collections/' + id, {method:'DELETE'});
  openProject(proj.id, proj.name);
}

async function openCollection(id, name) {
  coll={id,name};
  const docs = await fetch(API + '/documents/' + id).then(r => r.json());
  const keys = docs.length ? Object.keys(docs[0].data) : [];
  document.getElementById('mainContent').innerHTML = `
    <h2>📄 ${name} <span style="font-size:14px;color:#5f6368">(${docs.length})</span></h2>
    <button class="btn btn-green" onclick="showAddDoc()">+ Добавить документ</button>
    ${docs.length===0 ? '<div class="empty">Пусто</div>' : `
      <table><thead><tr><th>ID</th>${keys.map(k=>`<th>${k}</th>`).join('')}<th></th></tr></thead><tbody>
        ${docs.map(d=>`<tr>
          <td>#${d.id}</td>${keys.map(k=>`<td><pre>${d.data[k]||''}</pre></td>`).join('')}
          <td>
            <button class="btn btn-primary" onclick="editDoc(${d.id},'${encodeURIComponent(JSON.stringify(d.data))}')">✏️</button>
            <button class="btn btn-danger" onclick="delDoc(${d.id})">🗑</button>
          </td></tr>`).join('')}
      </tbody></table>`}`;
}

function showAddDoc() {
  document.getElementById('modalBox').innerHTML = `
    <h3>Новый документ</h3>
    <div id="fields"><div class="field-row"><input placeholder="Ключ" class="k"><input placeholder="Значение" class="v"><button onclick="this.parentElement.remove()">✕</button></div></div>
    <button onclick="addField()" style="background:#f1f3f4;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;margin-bottom:12px">+ Поле</button>
    <div class="modal-actions">
      <button onclick="closeModal()" style="background:#f1f3f4">Отмена</button>
      <button onclick="saveDoc()" style="background:#1a73e8;color:white">Сохранить</button>
    </div>`;
  document.getElementById('modal').classList.add('show');
}

function addField() {
  const d=document.createElement('div'); d.className='field-row';
  d.innerHTML='<input placeholder="Ключ" class="k"><input placeholder="Значение" class="v"><button onclick="this.parentElement.remove()">✕</button>';
  document.getElementById('fields').appendChild(d);
}

async function saveDoc() {
  const ks=document.querySelectorAll('.k'), vs=document.querySelectorAll('.v'), data={};
  ks.forEach((k,i)=>{if(k.value)data[k.value]=vs[i].value});
  await fetch(API+'/documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collectionId:coll.id,data})});
  closeModal(); openCollection(coll.id,coll.name);
}

function editDoc(id, dataStr) {
  const data=JSON.parse(decodeURIComponent(dataStr));
  let h='<h3>Редактировать #'+id+'</h3><div id="fields">';
  for(const[k,v]of Object.entries(data)) h+=`<div class="field-row"><input value="${k}" class="k"><input value="${v}" class="v"><button onclick="this.parentElement.remove()">✕</button></div>`;
  h+='</div><button onclick="addField()" style="background:#f1f3f4;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;margin-bottom:12px">+ Поле</button>';
  h+=`<div class="modal-actions"><button onclick="closeModal()" style="background:#f1f3f4">Отмена</button><button onclick="updateDoc(${id})" style="background:#1a73e8;color:white">Обновить</button></div>`;
  document.getElementById('modalBox').innerHTML=h; document.getElementById('modal').classList.add('show');
}

async function updateDoc(id) {
  const ks=document.querySelectorAll('.k'), vs=document.querySelectorAll('.v'), data={};
  ks.forEach((k,i)=>{if(k.value)data[k.value]=vs[i].value});
  await fetch(API+'/documents/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  closeModal(); openCollection(coll.id,coll.name);
}

async function delDoc(id) {
  if(!confirm('Удалить?')) return;
  await fetch(API+'/documents/'+id,{method:'DELETE'});
  openCollection(coll.id,coll.name);
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

loadProjects();
</script>
</body>
</html>
