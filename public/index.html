
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои проекты</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f172a;color:#e2e8f0;font-family:Arial;min-height:100vh;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        h1{text-align:center;color:#a78bfa;margin-bottom:20px}
        .add-btn{display:block;margin:0 auto 20px;padding:12px 30px;background:#22c55e;color:white;border:none;border-radius:10px;cursor:pointer;font-size:16px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
        .card{background:#1e293b;border-radius:12px;padding:20px;cursor:pointer;transition:.2s;border:1px solid #334155;text-decoration:none;color:#e2e8f0;display:block}
        .card:hover{border-color:#8b5cf6;transform:translateY(-2px)}
        .card .icon{font-size:30px;margin-bottom:8px}
        .card .name{font-size:16px;font-weight:600;margin-bottom:5px}
        .card .cat{font-size:12px;color:#94a3b8;background:#0f172a;display:inline-block;padding:3px 10px;border-radius:20px}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;align-items:center;justify-content:center}
        .modal.show{display:flex}
        .modal-box{background:#1e293b;padding:25px;border-radius:16px;width:400px}
        .modal-box h2{margin-bottom:15px;color:#a78bfa}
        .modal-box input,.modal-box select{width:100%;padding:10px;margin-bottom:10px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:white}
        .modal-box button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
        .btn-save{background:#22c55e;color:white}
        .btn-cancel{background:#ef4444;color:white}
    </style>
</head>
<body>
<div class="container">
    <h1>📁 Мои проекты</h1>
    <button class="add-btn" onclick="showForm()">+ Добавить проект</button>
    <div class="grid" id="grid">Загрузка...</div>
</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <h2>Добавить проект</h2>
        <input type="text" id="name" placeholder="Название">
        <input type="url" id="url" placeholder="Ссылка (https://...)">
        <input type="text" id="icon" placeholder="Иконка (эмодзи)" value="📄">
        <select id="category">
            <option>⭐ Главные</option><option>🤖 AI</option><option>🛠️ Инструменты</option><option>🎮 Игры</option><option>🎬 Медиа</option><option>📞 Связь</option><option>📱 Соцсети</option><option>📁 Другое</option>
        </select>
        <button class="btn-save" onclick="addProject()">✅ Сохранить</button>
        <button class="btn-cancel" onclick="closeModal()">❌ Отмена</button>
    </div>
</div>

<script>
const API = '/api/collections/1/documents';

async function load() {
    try {
        const res = await fetch(API);
        const docs = await res.json();
        const grid = document.getElementById('grid');
        if(!docs.length) { grid.innerHTML = '<p style="text-align:center;color:#94a3b8;">Нет проектов</p>'; return; }
        grid.innerHTML = docs.map(d => {
            const data = d.data || {};
            return `<a class="card" href="${data.url||'#'}" target="_blank">
                <div class="icon">${data.иконка||'📄'}</div>
                <div class="name">${data.название||'Без названия'}</div>
                <span class="cat">${data.категория||'📁 Другое'}</span>
            </a>`;
        }).join('');
    } catch(e) {
        document.getElementById('grid').innerHTML = '<p style="text-align:center;color:#f87171;">Ошибка загрузки</p>';
    }
}

function showForm() { document.getElementById('modal').classList.add('show'); }
function closeModal() { document.getElementById('modal').classList.remove('show'); }

async function addProject() {
    const название = document.getElementById('name').value.trim();
    const url = document.getElementById('url').value.trim();
    const иконка = document.getElementById('icon').value.trim() || '📄';
    const категория = document.getElementById('category').value;
    if(!название||!url) return alert('Заполни название и ссылку');
    
    await fetch(API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({название,url,иконка,категория})
    });
    closeModal();
    load();
}

load();
</script>
</body>
</html>
