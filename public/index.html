<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Firebase Clone</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;display:flex;height:100vh;background:#0f172a;color:#e2e8f0}
        .sidebar{width:260px;background:#1e293b;padding:20px;overflow-y:auto}
        .sidebar h2{color:#3b82f6;margin-bottom:15px;font-size:16px}
        #projectsList{margin-bottom:15px}
        .pitem{padding:10px 12px;margin:3px 0;border-radius:6px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center}
        .pitem:hover{background:#334155}
        .pitem.active{background:#3b82f6}
        .pitem span{cursor:pointer}
        .sidebar input{width:100%;padding:10px;border:none;border-radius:6px;background:#0f172a;color:white;margin-bottom:8px}
        .sidebar button{width:100%;padding:10px;background:#3b82f6;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
        .sidebar button:hover{background:#2563eb}
        .main{flex:1;padding:30px;overflow-y:auto}
        .main h2{margin-bottom:20px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:15px}
        .card{background:#1e293b;padding:18px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:1px solid #334155}
        .card:hover{border-color:#3b82f6}
        .card button{background:#ef4444;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px}
        table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:8px;overflow:hidden}
        th{background:#3b82f6;padding:10px 14px;text-align:left;font-size:12px}
        td{padding:8px 14px;border-bottom:1px solid #334155;font-size:13px}
        .btn{padding:6px 12px;border:none;border-radius:4px;cursor:pointer;font-size:12px;margin-right:4px;color:white}
        .btn-add{background:#22c55e;margin-bottom:15px;padding:8px 16px;font-size:13px}
        .btn-edit{background:#f59e0b}
        .btn-del{background:#ef4444}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;z-index:999}
        .modal.on{display:flex}
        .modal-box{background:#1e293b;padding:25px;border-radius:12px;width:450px;max-height:80vh;overflow-y:auto}
        .modal-box h3{margin-bottom:15px;color:#3b82f6}
        .modal-box input{width:100%;padding:10px;margin-bottom:8px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:white}
        .modal-box button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-right:8px}
        .row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
        .row input{flex:1;margin-bottom:0}
        .row button{background:#ef4444;color:white;padding:6px 10px;font-size:12px}
        .empty{text-align:center;padding:60px;color:#64748b}
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🔥 Мои проекты</h2>
        <div id="projectsList"></div>
        <input type="text" id="projectName" placeholder="Название проекта">
        <button onclick="createProject()">+ Создать проект</button>
    </div>
    
    <div class="main" id="mainContent">
        <div class="empty">← Выбери проект слева</div>
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-box" id="modalContent"></div>
    </div>

    <script>
        const API = '/api';
        let currentProject = null;
        let currentCollection = null;

        async function loadProjects() {
            const res = await fetch(API + '/projects');
            const projects = await res.json();
            document.getElementById('projectsList').innerHTML = projects.map(p => 
                `<div class="pitem ${currentProject && currentProject.id === p.id ? 'active' : ''}" onclick="openProject(${p.id}, '${p.name}')">
                    📁 ${p.name}
                    <span onclick="event.stopPropagation();deleteProject(${p.id})">✕</span>
                </div>`
            ).join('');
        }

        async function createProject() {
            const name = document.getElementById('projectName').value.trim();
            if (!name) { alert('Введи название!'); return; }
            
            const res = await fetch(API + '/projects', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name})
            });
            
            if (res.ok) {
                document.getElementById('projectName').value = '';
                loadProjects();
            } else {
                alert('Ошибка!');
            }
        }

        async function deleteProject(id) {
            if (!confirm('Удалить проект?')) return;
            await fetch(API + '/projects/' + id, {method: 'DELETE'});
            if (currentProject && currentProject.id === id) {
                currentProject = null;
                document.getElementById('mainContent').innerHTML = '<div class="empty">← Выбери проект</div>';
            }
            loadProjects();
        }

        async function openProject(id, name) {
            currentProject = {id, name};
            currentCollection = null;
            loadProjects();
            
            const res = await fetch(API + '/projects/' + id + '/collections');
            const collections = await res.json();
            
            document.getElementById('mainContent').innerHTML = `
                <h2>📁 ${name} — Коллекции</h2>
                <div class="grid">
                    ${collections.map(c => `
                        <div class="card" onclick="openCollection(${c.id}, '${c.name}')">
                            📄 ${c.name}
                            <button onclick="event.stopPropagation();deleteCollection(${c.id})">Удалить</button>
                        </div>
                    `).join('')}
                    <div class="card" onclick="showAddCollection()" style="border:2px dashed #334155;justify-content:center;">
                        + Новая коллекция
                    </div>
                </div>
            `;
        }

        function showAddCollection() {
            document.getElementById('modalContent').innerHTML = `
                <h3>Новая коллекция</h3>
                <input type="text" id="colName" placeholder="Название">
                <br>
                <button class="btn-add" onclick="createCollection()">Создать</button>
                <button class="btn-del" onclick="closeModal()">Отмена</button>
            `;
            document.getElementById('modal').classList.add('on');
        }

        async function createCollection() {
            const name = document.getElementById('colName').value.trim();
            if (!name) return;
            await fetch(API + '/projects/' + currentProject.id + '/collections', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            });
            closeModal();
            openProject(currentProject.id, currentProject.name);
        }

        async function deleteCollection(id) {
            if (!confirm('Удалить?')) return;
            await fetch(API + '/collections/' + id, {method: 'DELETE'});
            openProject(currentProject.id, currentProject.name);
        }

        async function openCollection(id, name) {
            currentCollection = {id, name};
            const res = await fetch(API + '/collections/' + id + '/documents');
            const docs = await res.json();
            const keys = docs.length > 0 ? Object.keys(docs[0].data) : [];
            
            document.getElementById('mainContent').innerHTML = `
                <h2>📄 ${name} <small>(${docs.length})</small></h2>
                <button class="btn btn-add" onclick="showAddDoc()">+ Добавить</button>
                <br><br>
                ${docs.length === 0 ? '<div class="empty">Пусто</div>' : `
                    <table>
                        <thead><tr><th>ID</th>${keys.map(k => `<th>${k}</th>`).join('')}<th></th></tr></thead>
                        <tbody>
                            ${docs.map(d => `
                                <tr>
                                    <td>#${d.id}</td>
                                    ${keys.map(k => `<td>${d.data[k] || ''}</td>`).join('')}
                                    <td>
                                        <button class="btn btn-edit" onclick="editDoc(${d.id}, '${encodeURIComponent(JSON.stringify(d.data))}')">✏️</button>
                                        <button class="btn btn-del" onclick="deleteDoc(${d.id})">✕</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `}
            `;
        }

        function showAddDoc() {
            document.getElementById('modalContent').innerHTML = `
                <h3>Новый документ</h3>
                <div id="fields">
                    <div class="row">
                        <input type="text" placeholder="Ключ" class="k">
                        <input type="text" placeholder="Значение" class="v">
                    </div>
                </div>
                <button onclick="addField()" style="background:#334155;color:white;margin-bottom:10px;">+ Поле</button><br>
                <button class="btn-add" onclick="saveDoc()">Сохранить</button>
                <button class="btn-del" onclick="closeModal()">Отмена</button>
            `;
            document.getElementById('modal').classList.add('on');
        }

        function addField() {
            const d = document.createElement('div');
            d.className = 'row';
            d.innerHTML = '<input type="text" placeholder="Ключ" class="k"><input type="text" placeholder="Значение" class="v"><button onclick="this.parentElement.remove()">✕</button>';
            document.getElementById('fields').appendChild(d);
        }

        async function saveDoc() {
            const ks = document.querySelectorAll('.k');
            const vs = document.querySelectorAll('.v');
            const data = {};
            ks.forEach((k, i) => { if (k.value) data[k.value] = vs[i].value; });
            await fetch(API + '/collections/' + currentCollection.id + '/documents', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            closeModal();
            openCollection(currentCollection.id, currentCollection.name);
        }

        function editDoc(id, dataStr) {
            const data = JSON.parse(decodeURIComponent(dataStr));
            let h = '<h3>Редактировать #'+id+'</h3><div id="fields">';
            for (const [k,v] of Object.entries(data)) {
                h += `<div class="row"><input type="text" value="${k}" class="k"><input type="text" value="${v}" class="v"><button onclick="this.parentElement.remove()">✕</button></div>`;
            }
            h += '</div><button onclick="addField()" style="background:#334155;color:white;margin-bottom:10px;">+ Поле</button><br>';
            h += `<button class="btn-add" onclick="updateDoc(${id})">Обновить</button>`;
            h += '<button class="btn-del" onclick="closeModal()">Отмена</button>';
            document.getElementById('modalContent').innerHTML = h;
            document.getElementById('modal').classList.add('on');
        }

        async function updateDoc(id) {
            const ks = document.querySelectorAll('.k');
            const vs = document.querySelectorAll('.v');
            const data = {};
            ks.forEach((k, i) => { if (k.value) data[k.value] = vs[i].value; });
            await fetch(API + '/documents/' + id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            closeModal();
            openCollection(currentCollection.id, currentCollection.name);
        }

        async function deleteDoc(id) {
            if (!confirm('Удалить?')) return;
            await fetch(API + '/documents/' + id, {method: 'DELETE'});
            openCollection(currentCollection.id, currentCollection.name);
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('on');
        }

        loadProjects();
    </script>
</body>
</html>
